<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#11100f">
    <title>Menú Online & Pedidos — La Papota | Del Viso</title>
    <meta name="description" content="Armá tu pedido online en La Papota. Hamburguesas smash, lomitos, super panchos, milanesas y papas rústicas. ¡Envío directo a WhatsApp!">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Menú Online — La Papota Burger House">
    <meta property="og:description" content="Elegí tus burgers y papas favoritas, armá tu comanda y pedí en 1 clic por WhatsApp.">
    <meta property="og:image" content="local_papota.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #11100f;
            --panel: #1b1917;
            --panel-card: #221e1a;
            --cream: #f6f0e6;
            --muted: #b3a99c;
            --orange: #ff642d;
            --orange-dark: #a93615;
            --gold: #ffc247;
            --line: rgba(255, 255, 255, 0.08);
            --line-light: rgba(255, 255, 255, 0.16);
            --wa-green: #25d366;
            --wa-green-dark: #128c7e;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --container: 1100px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        body {
            background-color: var(--bg);
            color: var(--cream);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            touch-action: pan-y;
            padding-bottom: 110px; /* Espacio para barra flotante de carrito */
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        button, input, select, textarea {
            font: inherit;
            color: inherit;
            border: none;
            background: none;
        }

        /* ==========================================================================
           HEADER SUPERIOR FIJO
           ========================================================================== */
        header.menu-header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            z-index: 90;
            background: rgba(17, 16, 15, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            transition: color 0.2s, background 0.2s;
        }

        .btn-back:hover {
            color: var(--gold);
            background: rgba(255, 255, 255, 0.08);
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: 0.03em;
        }

        .brand-link img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-quick-cart {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--orange);
            color: #1a0e08;
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--orange-dark);
            transition: transform 0.18s, background 0.18s;
        }

        .btn-quick-cart:hover {
            background: #ff7642;
            transform: translateY(-2px);
        }

        .cart-badge-count {
            background: #17110c;
            color: var(--gold);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.72rem;
            font-weight: 800;
        }

        /* ==========================================================================
           HERO COMPACTO DEL MENÚ
           ========================================================================== */
        .menu-hero {
            max-width: var(--container);
            margin: 0 auto;
            padding: 30px 5% 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        .menu-hero-copy h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2.2rem, 4.5vw, 3.4rem);
            text-transform: uppercase;
            line-height: 1.15;
            margin-top: 6px;
            margin-bottom: 10px;
        }

        .menu-hero-copy h1 span {
            color: var(--orange);
        }

        .menu-hero-copy p {
            color: var(--muted);
            font-size: 0.95rem;
            max-width: 540px;
        }

        .local-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(37, 211, 102, 0.12);
            border: 1px solid rgba(37, 211, 102, 0.35);
            color: var(--wa-green);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 14px;
            transition: all 0.3s ease;
        }

        .local-status-pill.is-closed {
            background: rgba(255, 77, 79, 0.12);
            border-color: rgba(255, 77, 79, 0.4);
            color: #ff5252;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--wa-green);
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.3);
            animation: pulse-dot 2s infinite;
        }

        .local-status-pill.is-closed .status-dot {
            background: #ff5252;
            box-shadow: 0 0 0 3px rgba(255, 82, 82, 0.25);
            animation: none;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(37, 211, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        /* ==========================================================================
           SELECTOR DE CATEGORÍAS (BARRA HORIZONTAL STICKY)
           ========================================================================== */
        .category-nav-bar {
            position: sticky;
            top: 70px;
            background: rgba(17, 16, 15, 0.92);
            border-bottom: 1px solid var(--line);
            z-index: 85;
            backdrop-filter: blur(10px);
            padding: 12px 5%;
        }

        .category-scroll {
            max-width: var(--container);
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: 50px;
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--muted);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-tab:hover {
            color: var(--cream);
            border-color: rgba(255, 100, 45, 0.4);
            background: rgba(255, 100, 45, 0.08);
        }

        .category-tab.active {
            background: var(--orange);
            color: #17100b;
            border-color: var(--orange);
            font-weight: 800;
        }

        /* ==========================================================================
           LISTADO Y GRILLA DE PRODUCTOS
           ========================================================================== */
        .menu-container {
            max-width: var(--container);
            margin: 0 auto;
            padding: 30px 5%;
        }

        .category-block {
            margin-bottom: 55px;
            scroll-margin-top: 140px;
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }

        .category-title h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.85rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .category-badge-pill {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--gold);
            background: rgba(255, 194, 71, 0.1);
            border: 1px solid rgba(255, 194, 71, 0.3);
            padding: 3px 10px;
            border-radius: 50px;
            text-transform: uppercase;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .product-card {
            background: var(--panel-card);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            gap: 18px;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .product-card:hover {
            border-color: rgba(255, 100, 45, 0.45);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }

        .product-photo {
            width: 120px;
            height: 120px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            flex-shrink: 0;
            background: #171310;
            position: relative;
        }

        .product-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-card:hover .product-photo img {
            transform: scale(1.08);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-width: 0;
        }

        .product-tag {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 2px;
        }

        .product-info h3 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.35rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-desc {
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.45;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            gap: 10px;
        }

        .product-price {
            font-family: 'Oswald', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--cream);
            letter-spacing: 0.03em;
        }

        /* Controles de Agregar / Cantidad */
        .btn-add-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--orange);
            color: #180e08;
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--orange-dark);
            transition: transform 0.15s, background 0.15s;
        }

        .btn-add-item:hover {
            background: #ff7642;
            transform: translateY(-2px);
        }

        .btn-add-item:active {
            transform: translateY(1px);
        }

        .qty-controls {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--line-light);
            border-radius: var(--radius-sm);
            padding: 3px 6px;
        }

        .qty-btn {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            background: var(--orange);
            color: #160d08;
            font-weight: 800;
            display: grid;
            place-items: center;
            font-size: 1rem;
            cursor: pointer;
        }

        .qty-num {
            font-weight: 800;
            font-size: 0.95rem;
            min-width: 18px;
            text-align: center;
            color: var(--gold);
        }

        /* ==========================================================================
           BARRA FLOTANTE INFERIOR DEL CARRITO (CONVERSIÓN DIRECTA)
           ========================================================================== */
        .sticky-cart-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(140%);
            width: min(92%, 520px);
            background: #1e1916;
            border: 2px solid var(--orange);
            border-radius: 50px;
            padding: 10px 14px 10px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 100, 45, 0.35);
            z-index: 100;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sticky-cart-bar.active {
            transform: translateX(-50%) translateY(0);
        }

        .cart-bar-info {
            display: flex;
            flex-direction: column;
        }

        .cart-bar-count {
            font-size: 0.78rem;
            color: var(--gold);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .cart-bar-total {
            font-family: 'Oswald', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
        }

        .btn-view-order {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--wa-green);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.92rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
            transition: transform 0.18s, background 0.18s;
            flex-shrink: 0;
        }

        .btn-view-order:hover {
            transform: scale(1.04);
            background: #2fe372;
        }

        /* ==========================================================================
           MODAL / DRAWER DE CHECKOUT ("MI PEDIDO")
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            place-items: center;
            padding: 18px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            display: grid;
            opacity: 1;
        }

        .modal-card {
            background: #1a1715;
            border: 1px solid var(--line-light);
            border-radius: var(--radius-lg);
            width: min(100%, 560px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            animation: modal-enter 0.25s ease-out;
        }

        @keyframes modal-enter {
            from { transform: translateY(20px) scale(0.97); }
            to { transform: translateY(0) scale(1); }
        }

        .modal-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            background: #211c19;
        }

        .modal-header h3 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.45rem;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-close-modal {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--muted);
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
        }

        .btn-close-modal:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.16);
        }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Lista de items en el modal */
        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .cart-item-unit-price {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .cart-item-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cart-item-subtotal {
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gold);
        }

        /* Formulario de Checkout */
        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-top: 1px solid var(--line);
            padding-top: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--gold);
            letter-spacing: 0.06em;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--line-light);
            border-radius: var(--radius-sm);
            padding: 11px 14px;
            font-size: 0.92rem;
            color: var(--cream);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--orange);
        }

        /* Selector de Tipo de Entrega (Delivery / Retiro) */
        .delivery-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .toggle-btn {
            padding: 11px;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: rgba(255, 100, 45, 0.15);
            border-color: var(--orange);
            color: var(--orange);
            font-weight: 800;
        }

        /* Métodos de Pago */
        .payment-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .payment-btn {
            padding: 10px 8px;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .payment-btn.active {
            background: rgba(255, 194, 71, 0.15);
            border-color: var(--gold);
            color: var(--gold);
            font-weight: 800;
        }

        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--line);
            background: #211c19;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .summary-total-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .summary-total-row span:first-child {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--muted);
        }

        .summary-total-row span:last-child {
            font-family: 'Oswald', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--gold);
        }

        .btn-submit-order {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--wa-green);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            padding: 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            box-shadow: 0 4px 0 var(--wa-green-dark), 0 10px 24px rgba(37, 211, 102, 0.25);
            transition: transform 0.18s, background 0.18s;
        }

        .btn-submit-order:hover {
            background: #2fe372;
            transform: translateY(-2px);
        }

        .btn-submit-order svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* ==========================================================================
           RESPONSIVE MOBILE
           ========================================================================== */
        @media (max-width: 820px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .product-photo {
                width: 100px;
                height: 100px;
            }

            .product-info h3 {
                font-size: 1.2rem;
            }

            .sticky-cart-bar {
                width: 95%;
                bottom: 15px;
                padding: 10px 12px 10px 18px;
            }

            .btn-view-order {
                padding: 11px 18px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 520px) {
            .product-card {
                gap: 12px;
                padding: 12px;
            }

            .product-photo {
                width: 85px;
                height: 85px;
            }

            .payment-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

                    },
                    {

                        tag: "Individual",
                        desc: "Coca-Cola común, Zero o Sprite.",
                        price: 1800,

                    },

                ]

        ];

        // Estado del Carrito en memoria y localStorage
        let cart = JSON.parse(localStorage.getItem('lapapota_cart')) || {};
        let deliveryMode = "delivery";
        let paymentMethod = "Efectivo";

        // Render inicial del menú
        function renderMenu(categoryFilter = "todos") {
            const container = document.getElementById('menuContainer');
            container.innerHTML = "";

            MENU_DATA.forEach(cat => {
                if (categoryFilter !== "todos" && cat.id !== categoryFilter) return;

                const catSection = document.createElement('section');
                catSection.className = "category-block";
                catSection.id = `cat-${cat.id}`;

                let productsHtml = "";
                cat.items.forEach(prod => {
                    const currentQty = cart[prod.id] ? cart[prod.id].qty : 0;
                    productsHtml += `
                        <article class="product-card">
                            <div class="product-photo">
                                <img src="${prod.image}" alt="${prod.name}" loading="lazy">
                            </div>
                            <div class="product-info">
                                <span class="product-tag">${prod.tag}</span>
                                <h3>${prod.name}</h3>
                                <p class="product-desc">${prod.desc}</p>
                                <div class="product-footer">
                                    <span class="product-price">$${prod.price.toLocaleString('es-AR')}</span>
                                    
                                    <button class="btn-add-item" id="btnAdd-${prod.id}" style="${currentQty > 0 ? 'display:none;' : ''}" onclick="addToCart('${prod.id}')">
                                        <span>+ Agregar</span>
                                    </button>

                                    <div class="qty-controls" id="qtyBox-${prod.id}" style="${currentQty > 0 ? 'display:inline-flex;' : ''}">
                                        <button class="qty-btn" onclick="decreaseQty('${prod.id}')" aria-label="Restar uno">-</button>
                                        <span class="qty-num" id="qtyNum-${prod.id}">${currentQty}</span>
                                        <button class="qty-btn" onclick="addToCart('${prod.id}')" aria-label="Sumar uno">+</button>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;
                });

                catSection.innerHTML = `
                    <div class="category-title">
                        <h2>${cat.name}</h2>
                        <span class="category-badge-pill">${cat.badge}</span>
                    </div>
                    <div class="products-grid">
                        ${productsHtml}
                    </div>
                `;

                container.appendChild(catSection);
            });

            updateCartUI();
        }

        // Búsqueda de item por ID
        function findProduct(id) {
            for (let cat of MENU_DATA) {
                let found = cat.items.find(item => item.id === id);
                if (found) return found;
            }
            return null;
        }

        // Agregar al carrito
        function addToCart(productId) {
            const product = findProduct(productId);
            if (!product) return;

            if (cart[productId]) {
                cart[productId].qty += 1;
            } else {
                cart[productId] = {
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    qty: 1
                };
            }

            saveCart();
            updateItemControls(productId);
            updateCartUI();
        }

        // Restar cantidad
        function decreaseQty(productId) {
            if (!cart[productId]) return;

            cart[productId].qty -= 1;
            if (cart[productId].qty <= 0) {
                delete cart[productId];
            }

            saveCart();
            updateItemControls(productId);
            updateCartUI();
            if (document.getElementById('cartModal').classList.contains('open')) {
                renderCartModalItems();
            }
        }

        // Actualizar visual de botones de cantidad de un producto
        function updateItemControls(productId) {
            const qty = cart[productId] ? cart[productId].qty : 0;
            const btnAdd = document.getElementById(`btnAdd-${productId}`);
            const qtyBox = document.getElementById(`qtyBox-${productId}`);
            const qtyNum = document.getElementById(`qtyNum-${productId}`);

            if (btnAdd && qtyBox && qtyNum) {
                if (qty > 0) {
                    btnAdd.style.display = 'none';
                    qtyBox.style.display = 'inline-flex';
                    qtyNum.textContent = qty;
                } else {
                    btnAdd.style.display = 'inline-flex';
                    qtyBox.style.display = 'none';
                    qtyNum.textContent = '0';
                }
            }
        }

        // Guardar en Storage
        function saveCart() {
            localStorage.setItem('lapapota_cart', JSON.stringify(cart));
        }

        // Actualizar totales de la barra flotante y header
        function updateCartUI() {
            let totalItems = 0;
            let totalPrice = 0;

            for (let id in cart) {
                totalItems += cart[id].qty;
                totalPrice += cart[id].qty * cart[id].price;
            }

            const headerBadge = document.getElementById('headerCartCount');
            const cartBarCount = document.getElementById('cartBarCount');
            const cartBarTotal = document.getElementById('cartBarTotal');
            const stickyBar = document.getElementById('stickyCartBar');
            const modalTotal = document.getElementById('modalTotal');

            if (headerBadge) headerBadge.textContent = totalItems;
            if (cartBarCount) cartBarCount.textContent = `${totalItems} ${totalItems === 1 ? 'producto' : 'productos'}`;
            if (cartBarTotal) cartBarTotal.textContent = `$${totalPrice.toLocaleString('es-AR')}`;
            if (modalTotal) modalTotal.textContent = `$${totalPrice.toLocaleString('es-AR')}`;

            if (stickyBar) {
                if (totalItems > 0) {
                    stickyBar.classList.add('active');
                } else {
                    stickyBar.classList.remove('active');
                }
            }
        }

        // Filtrar categorías
        function filterCategory(catId, btnEl) {
            document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            if (catId === 'todos') {
                renderMenu('todos');
            } else {
                renderMenu(catId);
                const section = document.getElementById(`cat-${catId}`);
                if (section) {
                    section.scrollIntoView({ behavior: 'smooth' });
                }
            }
        }

        // Modal de Carrito / Comanda
        function openCartModal() {
            const totalCount = Object.keys(cart).length;
            if (totalCount === 0) {
                alert("Tu carrito está vacío. ¡Elegí algo rico del menú para comenzar tu pedido!");
                return;
            }

            renderCartModalItems();
            const modal = document.getElementById('cartModal');
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.remove('open');
            document.body.style.overflow = '';
        }

        function closeModalOnBackdrop(e) {
            if (e.target.id === 'cartModal') {
                closeCartModal();
            }
        }

        // Renderizar items dentro del modal de pedido
        function renderCartModalItems() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = "";

            let totalCount = 0;
            for (let id in cart) {
                totalCount++;
                const item = cart[id];
                const subtotal = item.qty * item.price;

                const itemRow = document.createElement('div');
                itemRow.className = "cart-item-row";
                itemRow.innerHTML = `
                    <div>
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-unit-price">$${item.price.toLocaleString('es-AR')} c/u</div>
                    </div>
                    <div class="cart-item-right">
                        <div class="qty-controls" style="display:inline-flex;">
                            <button class="qty-btn" onclick="decreaseQty('${item.id}')">-</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="addToCart('${item.id}')">+</button>
                        </div>
                        <div class="cart-item-subtotal">$${subtotal.toLocaleString('es-AR')}</div>
                    </div>
                `;
                list.appendChild(itemRow);
            }

            if (totalCount === 0) {
                closeCartModal();
            }
        }

        // Modalidad Delivery vs Take Away
        function setDeliveryMode(mode) {
            deliveryMode = mode;
            const btnDel = document.getElementById('btnDelivery');
            const btnTake = document.getElementById('btnTakeAway');
            const addrGroup = document.getElementById('addressGroup');

            if (mode === 'delivery') {
                btnDel.classList.add('active');
                btnTake.classList.remove('active');
                addrGroup.style.display = 'flex';
            } else {
                btnTake.classList.add('active');
                btnDel.classList.remove('active');
                addrGroup.style.display = 'none';
            }
        }

        // Método de pago
        function setPaymentMethod(method) {
            paymentMethod = method;
            document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
            const changeGroup = document.getElementById('changeGroup');

            if (method === 'Efectivo') {
                document.getElementById('payCash').classList.add('active');
                changeGroup.style.display = 'flex';
            } else if (method === 'Transferencia') {
                document.getElementById('payTransf').classList.add('active');
                changeGroup.style.display = 'none';
            } else {
                document.getElementById('payMP').classList.add('active');
                changeGroup.style.display = 'none';
            }
        }

        // Generar y Enviar Comanda a WhatsApp
        function sendOrderToWhatsApp() {
            const name = document.getElementById('clientName').value.trim();
            const address = document.getElementById('clientAddress').value.trim();
            const cashAmount = document.getElementById('cashAmount').value.trim();
            const notes = document.getElementById('clientNotes').value.trim();

            if (!name) {
                alert("Por favor escribí tu nombre para identificar el pedido.");
                document.getElementById('clientName').focus();
                return;
            }

            if (deliveryMode === 'delivery' && !address) {
                alert("Por favor ingresá tu dirección para el envío.");
                document.getElementById('clientAddress').focus();
                return;
            }

            // Armar Comanda de texto
            let total = 0;
            let itemsText = "";

            for (let id in cart) {
                const item = cart[id];
                const sub = item.qty * item.price;
                total += sub;
                itemsText += `• ${item.qty}x ${item.name} ($${sub.toLocaleString('es-AR')})\n`;
            }

            let msg = `🍔 *NUEVO PEDIDO - LA PAPOTA* 🍟\n`;
            msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `👤 *Cliente:* ${name}\n`;
            msg += `📍 *Modalidad:* ${deliveryMode === 'delivery' ? '🛵 Envío a Domicilio' : '🏪 Retiro en el Local'}\n`;
            
            if (deliveryMode === 'delivery') {
                msg += `🏠 *Dirección:* ${address}\n`;
            }

            msg += `💵 *Forma de Pago:* ${paymentMethod}\n`;
            if (paymentMethod === 'Efectivo' && cashAmount) {
                msg += `💰 *Abona con:* ${cashAmount}\n`;
            }

            if (notes) {
                msg += `📝 *Aclaraciones:* ${notes}\n`;
            }

            msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `📋 *DETALLE DEL PEDIDO:*\n${itemsText}`;
            msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `💰 *TOTAL A PAGAR: $${total.toLocaleString('es-AR')}*\n`;
            msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `_Enviado desde el Menú Web La Papota_`;

            // Codificar URL y Abrir WhatsApp
            const encoded = encodeURIComponent(msg);
            const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encoded}`;

            window.open(waUrl, '_blank');
        }

        // Verificar estado de cocina en tiempo real (Horario oficial: 11:00 a 00:00 hs todos los días)
        function checkBusinessHours() {
            try {
                const now = new Date();
                const argOptions = { timeZone: 'America/Argentina/Buenos_Aires', hour: 'numeric', minute: 'numeric', hour12: false };
                const formatter = new Intl.DateTimeFormat('es-AR', argOptions);
                const parts = formatter.formatToParts(now);
                const hour = parseInt(parts.find(p => p.type === 'hour').value, 10);

                const pill = document.getElementById('localStatusPill');
                const text = document.getElementById('statusText');

                if (!pill || !text) return;

                // Abierto de 11:00 a 23:59 (00:00 medianoche)
                const isOpen = (hour >= 11);

                if (isOpen) {
                    pill.classList.remove('is-closed');
                    text.textContent = 'Cocina Abierta · Del Viso';
                } else {
                    pill.classList.add('is-closed');
                    text.textContent = 'Cocina Cerrada · Abre 11:00 hs';
                }
            } catch (e) {
                console.log('Error al verificar horarios:', e);
            }
        }

        // Iniciar
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            checkBusinessHours();
            setInterval(checkBusinessHours, 60000);
        });
    </script>

</body>
